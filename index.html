<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>James' Super Cool IS 201 Cheat Sheet</title>
<style>
  :root {
    --primary: #3d6b78;
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1f1f1f;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 2.5rem 1.25rem 3rem;
  }
  h1 {
    font-size: 1.6rem;
    text-align: center;
    margin: 0 0 0.25rem;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 1.75rem;
    text-align: center;
    font-size: 0.95rem;
  }
  .actions {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.75rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  a.button {
    display: inline-block;
    padding: 0.65rem 1.4rem;
    border-radius: 6px;
    text-decoration: none;
    font-family: system-ui, sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    border: 1.5px solid var(--primary);
    transition: background 0.15s ease, color 0.15s ease;
  }
  a.button.primary {
    background: var(--primary);
    color: white;
  }
  a.button.primary:hover { background: #2f545e; }
  a.button.secondary {
    background: transparent;
    color: var(--primary);
  }
  a.button.secondary:hover { background: #eef3f3; }
  .viewer {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    background: var(--card);
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    overflow: hidden;
    border: 1px solid #e3e3e0;
  }
  .viewer iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .fallback {
    display: none;
    padding: 2rem;
    text-align: center;
    color: var(--muted);
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;
  }
  footer {
    margin-top: 2rem;
    font-family: system-ui, sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  footer a { color: var(--primary); }
</style>
</head>
<body>
  <h1>James&rsquo; Super Cool IS 201 Cheat Sheet</h1>
  <p class="subtitle">ERDs &middot; SQL &middot; VBA &middot; Statistics &middot; HTML/CSS &middot; and more</p>

  <div class="actions">
    <a class="button primary" href="is201-cheatsheet.pdf" download>Download PDF</a>
    <a class="button secondary" href="is201-cheatsheet.pdf" target="_blank" rel="noopener">Open in New Tab</a>
  </div>

  <div class="viewer">
    <iframe src="is201-cheatsheet.pdf" title="IS 201 Cheat Sheet PDF"></iframe>
  </div>

  <footer>
    Source in <a href="https://github.com/jimna-h/james_super_cool_is_201_cheatsheet" target="_blank" rel="noopener">this repository</a>
  </footer>
</body>
</html>
